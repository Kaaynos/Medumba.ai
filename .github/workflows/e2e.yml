name: E2E (production)

# Manual trigger only — this suite runs against the live production site
# (see playwright.config.js and AGENTS.md: no staging Supabase project is
# provisioned yet, though the app now supports pointing a deployment at one
# via VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY), so it creates real
# accounts, XP and leaderboard rows. Run it deliberately, not on every push.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run pw:test
        env:
          TEST_ENV: production

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
